name: Deploy Little Ledger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare app files
        run: mkdir dist && cp index.html styles.css app.js dist/

      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy app
        id: deployment
        uses: actions/deploy-pages@v4
